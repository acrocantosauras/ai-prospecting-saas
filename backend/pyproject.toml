[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-prospecting-backend"
version = "0.1.0"
description = "AI Prospecting SaaS Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "sqlalchemy[asyncio]>=2.0.35",
    "pydantic-extra-types>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "crawlee>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-setuptools>=70.0.0",
    "openai>=2.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90", "D"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["D"]
# Engine exceptions are domain names exposed to callers and tests; renaming
# them to *Error would make the public contract noisier.
"app/engine/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
